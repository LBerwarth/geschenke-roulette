<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Phase 3 – Auspacken und Klauen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2C14E}a:hover{color:#FFD978}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 56px; background: #10291C; color: #F6F1E7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #B9C7B8; font-weight: 600">Phase 3 · Auspacken &amp; Klauen · 4 von 8 ausgepackt</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #1B3B2A; display: flex; align-items: center; font-size: 16px; font-weight: 600">Klau-Fenster: 0:09</span>
</div>
<div style="display: flex; gap: 40px; flex-grow: 1">
<div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 22px; color: #B9C7B8">Mama hat ausgepackt</span>
<div style="display: flex; align-items: baseline; gap: 20px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 120px; line-height: 1; color: #F2C14E">#4</span>
<span style="font-size: 20px; color: #B9C7B8">noch nie geklaut · 2 Klaus möglich</span>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 16px; color: #B9C7B8; font-weight: 600">Was ist drin? (optional, für die Endauswertung)
<input type="text" placeholder="z.B. Inhalt eintippen" style="height: 56px; border-radius: 12px; border: 2px solid #2E5640; background: #1B3B2A; color: #F6F1E7; padding: 0 16px; font: 500 20px Inter, sans-serif">
</label>
<div style="flex-grow: 1"></div>
<div style="display: flex; gap: 12px">
<button style="flex: 1 1 0; height: 64px; border-radius: 16px; border: 0; background: #F2C14E; color: #10291C; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">Niemand klaut – weiter</button>
</div>
</div>
<div style="width: 500px; flex-shrink: 0; background: #1B3B2A; border-radius: 24px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 22px; font-weight: 600">Wer will #4 klauen?</h2>
<p style="margin: 0 0 6px; font-size: 15px; color: #B9C7B8; line-height: 1.4">Kostet 1 Klau-Chip. Wer klaut, gibt sein eigenes Päckchen an Mama.</p>
<sc-for list="{{bidders}}" as="b" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; height: 52px">
<span style="flex-grow: 1; font-size: 19px; font-weight: 500">{{b.name}}</span>
<span style="font-size: 15px; color: #B9C7B8">{{b.chips}}</span>
<button style="height: 48px; width: 104px; border-radius: 12px; border: 2px solid #D9472F; background: {{b.btnBg}}; color: #FFFFFF; font: 600 16px Inter, sans-serif">{{b.label}}</button>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Oma', 2], ['Opa', 1], ['Papa', 0], ['Lena', 2], ['Tante', 1], ['Onkel', 2]
    ];
    return {
      bidders: list.map(([name, c]) => ({
        name,
        chips: c === 1 ? '1 Chip' : c + ' Chips',
        label: c > 0 ? 'Klauen' : 'Keine',
        btnBg: c > 0 ? '#D9472F' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
