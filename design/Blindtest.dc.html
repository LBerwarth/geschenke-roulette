<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Musik-Duell – Blindtest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2C14E}a:hover{color:#FFD978}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 56px; background: #10291C; color: #F6F1E7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #B9C7B8; font-weight: 600">Musik-Duell · Blindtest · Song 2 von 3</span>
<span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #1B3B2A; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><span style="width: 10px; height: 10px; border-radius: 5px; background: #6FCF8E"></span>Spotify · spielt auf [Lautsprecher] · ab Refrain</span>
</div>
<div style="border-radius: 28px; background: #F6F1E7; color: #10291C; padding: 32px 48px; display: flex; align-items: center; gap: 40px; height: 220px; box-sizing: border-box">
<div style="display: flex; align-items: flex-end; gap: 8px; height: 120px" aria-hidden="true">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="9">
<div style="width: 14px; height: {{b}}px; border-radius: 7px; background: #D9472F"></div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<span style="font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: #8A3220">Läuft · 0:14</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 56px; line-height: 1">? ? ?</span>
<span style="font-size: 20px; color: #3D5446">Best of 3 Songs. Mitzählen tun die Zuschauer.</span>
</div>
</div>
<div style="flex-grow: 1; border-radius: 28px; background: #1B3B2A; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1.15">Wer es weiß, haut auf den Tisch<br>und sagt Titel und Interpret.</div>
<div style="display: flex; gap: 12px"><button style="padding: 0 24px; height: 60px; border-radius: 16px; border: 2px solid #2E5640; background: transparent; color: #F6F1E7; font: 600 19px Inter, sans-serif">Auflösen</button><button style="padding: 0 24px; height: 60px; border-radius: 16px; border: 2px solid #2E5640; background: transparent; color: #F6F1E7; font: 600 19px Inter, sans-serif">Nächster Song</button><button style="flex: 1 1 0; height: 60px; border-radius: 16px; border: 0; background: #F2C14E; color: #10291C; font: 600 19px Inter, sans-serif">Spieler 7 gewinnt</button><button style="flex: 1 1 0; height: 60px; border-radius: 16px; border: 0; background: #2F6B9A; color: #FFFFFF; font: 600 19px Inter, sans-serif">Lena gewinnt</button><button style="padding: 0 22px; height: 60px; border-radius: 16px; border: 2px solid #2E5640; background: transparent; color: #F6F1E7; font: 600 18px Inter, sans-serif">Unentschieden – beide gewinnen</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { bars: [40, 90, 60, 120, 75, 100, 50, 85, 30] };
  }
}
</script>
</body>
</html>
