<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Geschenketisch – Übersicht</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2C14E}a:hover{color:#FFD978}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 56px; background: #10291C; color: #F6F1E7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; color: #B9C7B8; font-weight: 600">Runde B · 15 Cousins &amp; Cousinen</span>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 44px; line-height: 1">Wer hat was?</h1>
</div>
<div style="display: flex; gap: 20px; font-size: 15px; color: #B9C7B8">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 6px; background: #F2C14E"></span>1× geklaut</span>
<span style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>gesperrt</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; flex-grow: 1">
<sc-for list="{{gifts}}" as="g" hint-placeholder-count="15">
<div style="background: {{g.bg}}; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid {{g.border}}">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px">#{{g.id}}</span>
<sc-if value="{{g.locked}}" hint-placeholder-val="{{false}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B9C7B8" stroke-width="2" stroke-linecap="round" role="img" aria-label="gesperrt"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</sc-if>
<sc-if value="{{g.stolen}}" hint-placeholder-val="{{false}}">
<span style="width: 14px; height: 14px; border-radius: 7px; background: #F2C14E" role="img" aria-label="1× geklaut"></span>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 20px; font-weight: 600">{{g.holder}}</span></div>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const steals = [0, 1, 0, 2, 0, 0, 1, 0, 0, 2, 0, 1, 0, 0, 0];
    const rows = steals.map((s, i) => [i === 4 ? 'Lena' : 'Spieler ' + (i + 1), s]);
    return {
      gifts: rows.map(([holder, steals], i) => ({
        id: i + 1,
        holder,
        stolen: steals === 1,
        locked: steals >= 2,
        bg: steals >= 2 ? '#0B1F15' : '#1B3B2A',
        border: steals >= 2 ? '#2E5640' : (steals === 1 ? '#F2C14E' : '#1B3B2A')
      }))
    };
  }
}
</script>
</body>
</html>
